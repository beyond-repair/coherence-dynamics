[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coherence-dynamics"
version = "0.1.0"
description = "Coherence Dynamics: research repository for effective responses from coarse-graining and correlations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Atomic Dream Labs"}]
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spectral*", "numerics*", "theory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
